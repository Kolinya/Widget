<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SAG Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Montserrat', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    color: #fff;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    height: 100%;
    padding: 4px;
    gap: 6px;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    padding: 4px 10px;
    gap: 6px;
    background: linear-gradient(135deg, rgba(40,40,45,0.9), rgba(60,60,65,0.85));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    cursor: pointer;
    flex-shrink: 0;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex: 1;
    min-width: 0;
  }
  .item svg { width: 15px; height: 15px; flex-shrink: 0; }
  .val {
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }
  .trend {
    font-size: 11px;
    font-weight: 900;
    margin-left: 2px;
    display: inline-block;
    width: 10px;
  }
  .trend.up { color: #4EFA8A; }
  .trend.down { color: #FF5555; }
  .div {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.18);
    flex-shrink: 0;
  }
  .del-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #B23A3A;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .del-btn:hover { background: #E14B4B; }
  .del-btn svg { width: 14px; height: 14px; }
  .del-btn {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    outline: none !important;
    box-shadow: none !important;
  }
  .del-btn:focus, .del-btn:focus-visible, .del-btn:active, .del-btn:hover {
    outline: none !important;
    box-shadow: none !important;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar">
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
        <line x1="13" y1="19" x2="19" y2="13"></line>
        <line x1="16" y1="16" x2="20" y2="20"></line>
        <line x1="19" y1="21" x2="21" y2="19"></line>
        <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline>
        <line x1="5" y1="14" x2="9" y2="18"></line>
        <line x1="7" y1="17" x2="4" y2="20"></line>
        <line x1="3" y1="19" x2="5" y2="21"></line>
      </svg>
      <span class="val" id="battles">—</span>
    </div>
    <div class="div"></div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4EFA8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22V4"></path>
        <path d="M4 4h14l-3 4 3 4H4"></path>
      </svg>
      <span class="val" id="wr">—</span><span class="trend" id="wrTrend"></span>
    </div>
    <div class="div"></div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FF5555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 13.5c1.7-1.7 3-3.6 3-6a5 5 0 0 0-9-3 5 5 0 0 0-9 3c0 4.2 3.2 7.4 10.5 12.7l0.7-0.5"></path>
        <path d="M12.5 4.5l-1.2 4.3 2.2 2.2-1.2 4.3"></path>
      </svg>
      <span class="val" id="dmg">—</span><span class="trend" id="dmgTrend"></span>
    </div>
    <div class="del-btn" id="resetBarBtn" role="button" tabindex="-1" title="Скинути сесію">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
      </svg>
    </div>

  </div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const ACCOUNT_ID = q.get('account_id') || q.get('dbid') || '';
  const APP_ID = q.get('app_id') || 'a480f3908ece4c0aa35cdcd85458760a';
  const realm = (q.get('realm') || 'eu').toLowerCase();
  const API_HOST = {
    eu: 'api.wotblitz.eu', na: 'api.wotblitz.com', us: 'api.wotblitz.com',
    asia: 'api.wotblitz.asia', ru: 'api.wotblitz.ru'
  }[realm] || 'api.wotblitz.eu';

  const LS_ACC = 'sag_car_acc_' + ACCOUNT_ID;

  function wrColor(wr) {
    if (wr < 50) return '#FF5555';
    if (wr < 60) return '#5db35e';
    if (wr < 70) return '#3972c6';
    return '#c06dff';
  }

  // Пам'ять для стрілок тренду: зберігає попереднє значення й останній
  // напрямок. Якщо між оновленнями значення не змінилось, стрілка НЕ
  // зникає і НЕ скидається — лишається та, що була показана востаннє.
  let prevWr = null, prevDmg = null;
  let wrTrend = null, dmgTrend = null; // 'up' | 'down' | null

  function renderTrend(elId, current, prevVal, currentTrendState) {
    const el = document.getElementById(elId);
    let trend = currentTrendState;
    if (prevVal !== null) {
      if (current > prevVal) trend = 'up';
      else if (current < prevVal) trend = 'down';
      // якщо current === prevVal — trend лишається попереднім (не скидається)
    }
    if (trend === 'up') {
      el.textContent = '▲';
      el.className = 'trend up';
    } else if (trend === 'down') {
      el.textContent = '▼';
      el.className = 'trend down';
    } else {
      el.textContent = '';
      el.className = 'trend';
    }
    return trend;
  }

  function doReset(e) {
    if (e) e.stopPropagation();
    if (e && e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
    localStorage.removeItem(LS_ACC);
    prevWr = null; prevDmg = null; wrTrend = null; dmgTrend = null;
    document.getElementById('wrTrend').textContent = '';
    document.getElementById('dmgTrend').textContent = '';
    tick();
  }
  var rb = document.getElementById('resetBarBtn');
  if (rb) rb.addEventListener('click', doReset);


  async function tick() {
    if (!ACCOUNT_ID) {
      document.getElementById('battles').textContent = '?';
      return;
    }
    try {
      const ts = Date.now();
      const accRes = await fetch(`https://${API_HOST}/wotb/account/info/?application_id=${APP_ID}&account_id=${ACCOUNT_ID}&fields=statistics.all&_nc=${ts}`, {cache:'no-store'});
      const accData = await accRes.json();
      if (accData.status !== 'ok' || !accData.data[ACCOUNT_ID]) return;

      const currentAll = accData.data[ACCOUNT_ID].statistics.all;

      let startAcc = null;
      try {
        startAcc = JSON.parse(localStorage.getItem(LS_ACC) || 'null');
      } catch (e) {}

      if (!startAcc) {
        startAcc = currentAll;
        localStorage.setItem(LS_ACC, JSON.stringify(startAcc));
      }

      const battles = currentAll.battles - startAcc.battles;
      const wins = currentAll.wins - startAcc.wins;
      const damage = currentAll.damage_dealt - startAcc.damage_dealt;

      document.getElementById('battles').textContent = battles;
      if (battles > 0) {
        const wr = +(wins / battles * 100).toFixed(1);
        const avgDmg = Math.round(damage / battles);

        const el = document.getElementById('wr');
        el.textContent = wr + '%';
        el.style.color = wrColor(wr);
        document.getElementById('dmg').textContent = avgDmg;

        wrTrend = renderTrend('wrTrend', wr, prevWr, wrTrend);
        dmgTrend = renderTrend('dmgTrend', avgDmg, prevDmg, dmgTrend);
        prevWr = wr;
        prevDmg = avgDmg;
      } else {
        document.getElementById('wr').textContent = '0%';
        document.getElementById('wr').style.color = '#fff';
        document.getElementById('dmg').textContent = '0';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('battles').textContent = '!';
    }
  }

  tick();
  setInterval(tick, 5000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SAG Hangar Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Montserrat', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    min-height: 48px;
    padding: 4px 10px;
    gap: 6px;
    background: linear-gradient(135deg, rgba(40,40,45,0.88), rgba(60,60,65,0.82));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    position: relative;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .val {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    white-space: nowrap;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .div {
    width: 1px;
    height: 22px;
    background: rgba(255,255,255,0.18);
    flex-shrink: 0;
  }
  .err { color: #ff8888; font-size: 12px; font-weight: 800; text-align: center; width: 100%; }

  /* Кнопка скидання */
  .reset-btn {
    background: #d9534f;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: 6px;
    transition: all 0.15s ease-in-out;
    flex-shrink: 0;
  }
  .reset-btn:hover {
    background: #c9302c;
    transform: scale(1.08);
  }
  .reset-btn:active {
    transform: scale(0.95);
  }
  .reset-btn svg {
    width: 14px;
    height: 14px;
    fill: white;
  }
</style>
</head>
<body>
<div class="bar" id="bar">
  <!-- 1. Мечі у точному стилі з гри зліва від числа -->
  <div class="item" title="Бої">
    <svg viewBox="0 0 24 24" fill="#FFD700">
      <!-- Перший меч (зліва направо вгору) -->
      <path d="M4.5 16.5L16.5 4.5L19.5 7.5L7.5 19.5L4.5 16.5Z"/>
      <path d="M3 21L6.5 17.5L5 16L2 19L3 21Z"/>
      <!-- Гарда першого меча -->
      <path d="M13.5 6.5L15.5 8.5L14.5 9.5L12.5 7.5L13.5 6.5Z"/>

      <!-- Другий меч (праворуч наліво вгору) -->
      <path d="M16.5 16.5L4.5 4.5L7.5 1.5L19.5 13.5L16.5 16.5Z"/>
      <path d="M21 21L17.5 17.5L19 16L22 19L21 21Z"/>
      <!-- Гарда другого меча -->
      <path d="M16.5 13.5L14.5 15.5L13.5 14.5L15.5 12.5L16.5 13.5Z"/>
    </svg>
    <span class="val" id="battles">—</span>
  </div>
  <div class="div"></div>

  <!-- 2. Прапорець зліва від вінрейту -->
  <div class="item" title="Вінрейт">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5db35e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22V4"/><path d="M4 4h14l-3 4 3 4H4"/>
    </svg>
    <span class="val" id="wr">—</span>
  </div>
  <div class="div"></div>

  <!-- 3. Серце зліва від урону -->
  <div class="item" title="Середній урон">
    <svg viewBox="0 0 24 24" fill="none" stroke="#FF5555" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      <path d="M12 3 L11 7 L13 10.5 L12 13" stroke="#FF5555" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <span class="val" id="dmg">—</span>
  </div>

  <!-- Кнопка скидання -->
  <button class="reset-btn" id="resetBtn" title="Скинути сесію">
    <svg viewBox="0 0 24 24"><path d="M3 6v18h18v-18h-18zm5 14c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm4-18v2h-20v-2h5.711c.9 0 1.631-1.099 1.631-2h5.316c0 .901.73 2 1.631 2h5.711z"/></svg>
  </button>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const ACCOUNT_ID = q.get('account_id') || q.get('dbid') || '';
  const APP_ID = q.get('app_id') || q.get('application_id') || 'YOUR_APP_ID';
  const realm = (q.get('realm') || 'eu').toLowerCase();
  const API_HOST = {
    eu: 'api.wotblitz.eu',
    na: 'api.wotblitz.com',
    us: 'api.wotblitz.com',
    asia: 'api.wotblitz.asia',
    ru: 'api.wotblitz.ru',
    cn: 'api.wotblitz.cn'
  }[realm] || 'api.wotblitz.eu';

  const LS_ACC = 'sag_hangar_start_acc_' + ACCOUNT_ID;
  const LS_TIME = 'sag_hangar_start_ts_' + ACCOUNT_ID;

  function wrColor(wr) {
    if (wr < 50) return '#FF5555';
    if (wr < 60) return '#5db35e';
    if (wr < 70) return '#3972c6';
    return '#c06dff';
  }

  async function tick() {
    if (!ACCOUNT_ID || APP_ID === 'YOUR_APP_ID') {
      document.getElementById('bar').innerHTML = '<div class="err">немає account_id / app_id</div>';
      return;
    }
    try {
      const ts = Date.now();
      const url = `https://${API_HOST}/wotb/account/info/?application_id=${APP_ID}&account_id=${ACCOUNT_ID}&fields=statistics.all&_nc=${ts}`;
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      if (data.status !== 'ok' || !data.data || !data.data[ACCOUNT_ID]) {
        document.getElementById('battles').textContent = '?';
        return;
      }
      const all = data.data[ACCOUNT_ID].statistics.all;
      let start = null;
      try { start = JSON.parse(localStorage.getItem(LS_ACC) || 'null'); } catch (e) {}
      if (!start) {
        start = all;
        localStorage.setItem(LS_ACC, JSON.stringify(all));
        localStorage.setItem(LS_TIME, String(Date.now()));
      }
      const battles = all.battles - start.battles;
      const wins = all.wins - start.wins;
      const damage = all.damage_dealt - start.damage_dealt;
      document.getElementById('battles').textContent = battles;
      if (battles > 0) {
        const wr = +(wins / battles * 100).toFixed(1);
        const avg = Math.round(damage / battles);
        const el = document.getElementById('wr');
        el.textContent = wr + '%';
        el.style.color = wrColor(wr);
        document.getElementById('dmg').textContent = avg;
      } else {
        document.getElementById('wr').textContent = '0%';
        document.getElementById('wr').style.color = '#fff';
        document.getElementById('dmg').textContent = '0';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('battles').textContent = '!';
    }
  }

  function resetSession() {
    localStorage.removeItem(LS_ACC);
    localStorage.removeItem(LS_TIME);
    tick();
  }

  document.getElementById('resetBtn').addEventListener('click', resetSession);

  tick();
  setInterval(tick, 5000);
})();
</script>
</body>
</html>

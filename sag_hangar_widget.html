<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SAG Hangar Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Montserrat', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    min-height: 48px;
    padding: 4px 10px;
    gap: 6px;
    background: linear-gradient(135deg, rgba(40,40,45,0.88), rgba(60,60,65,0.82));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    position: relative; /* Потрібно для позиціонування кнопки скидання */
  }

  /* Анімація появи кнопки скидання */
  .bar:hover .reset-btn,
  .bar:focus-within .reset-btn {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex: 1;
    min-width: 0;
  }
  .item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .val {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    white-space: nowrap;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .div {
    width: 1px;
    height: 22px;
    background: rgba(255,255,255,0.18);
    flex-shrink: 0;
  }
  .err { color: #ff8888; font-size: 12px; font-weight: 800; text-align: center; width: 100%; }

  /* Стилі для кнопки скидання */
  .reset-btn {
    background: #d9534f; /* Червоний колір як на картинці */
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: 8px;
    transition: all 0.2s ease-in-out;
    opacity: 0; /* Приховано за замовчуванням */
    pointer-events: none; /* Не реагує на кліки, коли приховано */
    transform: translateX(10px); /* Трохи зміщено вправо */
    flex-shrink: 0;
  }
  .reset-btn:hover {
    background: #c9302c;
    transform: scale(1.1);
  }
  .reset-btn:active {
    transform: scale(0.95);
  }
  .reset-btn svg {
    width: 14px;
    height: 14px;
    fill: white;
  }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="item" title="Бої">
    <svg viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/>
    </svg>
    <span class="val" id="battles">—</span>
  </div>
  <div class="div"></div>
  <div class="item" title="Вінрейт">
    <!-- Оновлена іконка вінрейту (сучасніша) -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#5db35e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span class="val" id="wr">—</span>
  </div>
  <div class="div"></div>
  <div class="item" title="Середній урон">
    <!-- Нова розколота іконка сердечка -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#FF5555" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="none" fill="#FF5555"/>
      <path d="M12 3 c 0,0,0.6,6.6,6,8" stroke-width="2"/>
      <path d="M12 3 c 0,0,-0.6,6.6,-6,8" stroke-width="2"/>
      <path d="M12 21.35 l -1.45 -1.32 C 5.4 15.36, 2 12.28, 2 8.5" stroke-width="2" stroke-linecap="butt" stroke-dasharray="0 0"/>
      <path d="M 22 8.5 C 22 12.28, 18.6 15.36, 13.45 20.03 L 12 21.35" stroke-width="2" stroke-linecap="butt"/>
    </svg>
    <span class="val" id="dmg">—</span>
  </div>

  <!-- Кнопка скидання сесії -->
  <button class="reset-btn" id="resetBtn" title="Скинути сесію">
    <svg viewBox="0 0 24 24"><path d="M3 6v18h18v-18h-18zm5 14c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm4-18v2h-20v-2h5.711c.9 0 1.631-1.099 1.631-2h5.316c0 .901.73 2 1.631 2h5.711z"/></svg>
  </button>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const ACCOUNT_ID = q.get('account_id') || q.get('dbid') || '';
  const APP_ID = q.get('app_id') || q.get('application_id') || 'YOUR_APP_ID'; // <- або пропиши свій application_id тут
  // realm: eu / na / asia / ru — API host
  const realm = (q.get('realm') || 'eu').toLowerCase();
  const API_HOST = {
    eu: 'api.wotblitz.eu',
    na: 'api.wotblitz.com',
    us: 'api.wotblitz.com',
    asia: 'api.wotblitz.asia',
    ru: 'api.wotblitz.ru',
    cn: 'api.wotblitz.cn'
  }[realm] || 'api.wotblitz.eu';

  const LS_ACC = 'sag_hangar_start_acc_' + ACCOUNT_ID;
  const LS_TIME = 'sag_hangar_start_ts_' + ACCOUNT_ID;

  function wrColor(wr) {
    if (wr < 50) return '#FF5555';
    if (wr < 60) return '#5db35e';
    if (wr < 70) return '#3972c6';
    return '#c06dff';
  }

  async function tick() {
    if (!ACCOUNT_ID || APP_ID === 'YOUR_APP_ID') {
      document.getElementById('bar').innerHTML = '<div class="err">немає account_id / app_id</div>';
      return;
    }
    try {
      const ts = Date.now();
      const url = `https://${API_HOST}/wotb/account/info/?application_id=${APP_ID}&account_id=${ACCOUNT_ID}&fields=statistics.all&_nc=${ts}`;
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      if (data.status !== 'ok' || !data.data || !data.data[ACCOUNT_ID]) {
        document.getElementById('battles').textContent = '?';
        return;
      }
      const all = data.data[ACCOUNT_ID].statistics.all;
      let start = null;
      try { start = JSON.parse(localStorage.getItem(LS_ACC) || 'null'); } catch (e) {}
      if (!start) {
        start = all;
        localStorage.setItem(LS_ACC, JSON.stringify(all));
        localStorage.setItem(LS_TIME, String(Date.now()));
      }
      const battles = all.battles - start.battles;
      const wins = all.wins - start.wins;
      const damage = all.damage_dealt - start.damage_dealt;
      document.getElementById('battles').textContent = battles;
      if (battles > 0) {
        const wr = +(wins / battles * 100).toFixed(1);
        const avg = Math.round(damage / battles);
        const el = document.getElementById('wr');
        el.textContent = wr + '%';
        el.style.color = wrColor(wr);
        document.getElementById('dmg').textContent = avg;
      } else {
        document.getElementById('wr').textContent = '0%';
        document.getElementById('wr').style.color = '#fff';
        document.getElementById('dmg').textContent = '0';
      }
    } catch (e) {
      console.error(e);
      document.getElementById('battles').textContent = '!';
    }
  }

  // Функція скидання сесії
  function resetSession() {
    localStorage.removeItem(LS_ACC);
    localStorage.removeItem(LS_TIME);
    tick();
  }

  // Обробник кліку по кнопці скидання
  document.getElementById('resetBtn').addEventListener('click', resetSession);

  // Видалено обробник події double-click з bar

  tick();
  setInterval(tick, 5000);
})();
</script>
</body>
</html>

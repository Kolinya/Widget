<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>SAG Session Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    position: relative;
    background: transparent;
    font-family: 'Montserrat', sans-serif;
    -webkit-app-region: drag;
    -webkit-user-select: none;
    user-select: none;
  }

  .banner-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: absolute;
    top: 10px;
    left: 50%;
    width: 900px;
    transform: translateX(-50%);
    -webkit-app-region: drag;
  }

  .session-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: linear-gradient(135deg, rgba(60, 60, 65, 0.75) 0%, rgba(75, 75, 80, 0.7) 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 10px 20px;
    gap: 12px;
    box-shadow: none;
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 2;
  }

  .pill-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex: 1;
  }

  .pill-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }

  .pill-value {
    font-size: 36px;
    font-weight: 900;
    color: #FFF;
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }

  .trend-arrow {
    font-size: 26px;
    font-weight: 900;
    line-height: 1;
  }
  .trend-up {
    color: #5db35e;
  }
  .trend-down {
    color: #FF5555;
  }

  .pill-divider {
    width: 1px;
    height: 44px;
    background: rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
  }

  .pill-toggle-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    padding: 6px;
    transition: all 0.2s ease;
    -webkit-app-region: no-drag;
  }

  .pill-toggle-btn:hover {
    color: #E0E0E0;
  }

  .pill-toggle-btn.open svg {
    transform: rotate(180deg);
  }

  .pill-toggle-btn svg {
    width: 26px;
    height: 26px;
    transition: transform 0.3s ease;
  }

  .pill-delete-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #B23A3A;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }

  .pill-delete-btn:hover {
    background: #E14B4B;
    box-shadow: 0 0 12px rgba(225, 75, 75, 0.7);
  }

  .pill-delete-btn svg {
    width: 24px;
    height: 24px;
  }

  .tanks-dropdown {
    width: 100%;
    max-height: 0;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(60, 60, 65, 0.75) 0%, rgba(75, 75, 80, 0.7) 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    margin-top: 6px;
    transition: max-height 0.4s ease, padding 0.4s ease;
    box-shadow: none;
    backdrop-filter: blur(10px);
    z-index: 1;
    -webkit-app-region: no-drag;
  }

  .tanks-dropdown.open {
    max-height: 500px;
    overflow-y: auto;
    padding: 16px 20px;
  }

  .tanks-dropdown::-webkit-scrollbar {
    width: 8px;
  }
  .tanks-dropdown::-webkit-scrollbar-thumb {
    background: #FFE600;
    border-radius: 4px;
  }

  .tanks-table {
    width: 100%;
    border-collapse: collapse;
    color: #FFF;
    font-size: 36px;
  }

  .tanks-table th {
    color: #FFF;
    text-transform: uppercase;
    font-size: 32px;
    font-weight: 900;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    text-align: center;
  }

  .tanks-table th.tank-name-col {
    text-align: left;
    padding-left: 6px;
  }

  .tanks-table td {
    padding: 14px 6px;
    text-align: center;
    font-weight: 900;
    font-size: 36px;
    color: #FFF;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .tanks-table td.tank-name {
    text-align: left;
    color: #FFE600;
    padding-left: 6px;
  }

  .no-tanks {
    text-align: center;
    color: #888;
    font-size: 32px;
    padding: 20px 0;
  }

  .session-banner.interactive-mode {
    border-color: #5db35e;
    box-shadow: 0 0 20px rgba(93, 179, 94, 0.55), inset 0 0 10px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<div class="banner-wrapper">
  <div class="session-banner">
    <div class="pill-item">
      <svg class="pill-icon" viewBox="0 0 24 24" fill="#FFD700">
        <path d="M14.5 2C14.5 2 13 3.5 13 5.5C13 6.5 13.5 7.5 14 8L6 16C5.5 16.5 5 17.5 5 18.5C5 19.5 5.5 20 6 20.5C6.5 21 7 21.5 8 21.5C9 21.5 10 21 10.5 20.5L18.5 12.5C19 13 20 13.5 21 13.5C23 13.5 24.5 12 24.5 12L14.5 2Z" transform="translate(-3 -1) scale(0.9)"/>
        <path d="M9.5 14.5L12.5 17.5" stroke="#3C3C41" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5L2.5 21.5" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5L21.5 2.5" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div id="battles-container" class="pill-value"><span id="battles">0</span></div>
    </div>

    <div class="pill-divider"></div>

    <div class="pill-item">
      <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="#5db35e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22V4"></path>
        <path d="M4 4h14l-3 4 3 4H4"></path>
      </svg>
      <div id="winrate-container" class="pill-value"><span id="winrate">0%</span></div>
    </div>

    <div class="pill-divider"></div>

    <!-- Розколоте сердечко з тріщиною зверху -->
    <div class="pill-item">
      <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="#FF5555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Ліва частина серця -->
        <path d="M12 21.23l-1.06-1.06a5.5 5.5 0 0 1-7.78-7.78l1.06-1.06L12 5.67"></path>
        <!-- Права частина серця -->
        <path d="M12 5.67l7.78 7.78a5.5 5.5 0 0 1 0 7.78l-1.06 1.06"></path>
        <!-- Зігзагоподібна тріщина по центру зверху -->
        <path d="M12 2v4l-2 3 3 2-2 4" stroke-width="1.8"></path>
      </svg>
      <div id="damage-container" class="pill-value"><span id="avg-damage">0</span></div>
    </div>

    <button id="toggle-btn" class="pill-toggle-btn" onclick="toggleDropdown()" title="Список танків">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <button class="pill-delete-btn" onclick="resetSession()" title="Скинути сесію">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
      </svg>
    </button>
  </div>

  <div id="tanks-dropdown" class="tanks-dropdown">
    <table class="tanks-table">
      <thead>
        <tr>
          <th class="tank-name-col">Танк</th>
          <th>Бої</th>
          <th>%</th>
          <th>с/ш</th>
        </tr>
      </thead>
      <tbody id="tanks-list-body">
        <tr>
          <td colspan="4" class="no-tanks">Немає зіграних боїв</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="config.js"></script>

  let vehicleDetailsMap = {};
  let previousWr = null;
  let previousDmg = null;

  async function fetchTankNames() {
    for (let id in LOCAL_TANK_NAMES) {
      vehicleDetailsMap[id] = LOCAL_TANK_NAMES[id];
    }
    try {
      let page = 1;
      let totalPages = 1;
      while (page <= totalPages) {
        const res = await fetch(`https://api.wotblitz.eu/wotb/encyclopedia/vehicles/?application_id=${CONFIG.APPLICATION_ID}&language=ru&page_no=${page}`);
        const data = await res.json();
        if (data.status === "ok" && data.data) {
          totalPages = data.meta.page_total || totalPages;
          for (let tId in data.data) {
            if (!vehicleDetailsMap[tId]) {
              const item = data.data[tId];
              vehicleDetailsMap[tId] = { name: item.name, tier: item.tier || 10 };
            }
          }
        } else break;
        page++;
      }
    } catch (e) {
      console.warn("WG API недоступне:", e.message);
    }
  }

  function toggleDropdown() {
    const dropdown = document.getElementById('tanks-dropdown');
    const btn = document.getElementById('toggle-btn');
    dropdown.classList.toggle('open');
    btn.classList.toggle('open');
  }

  let naturalWidth = 900;
  let naturalHeight = 0;
  const MIN_SCALE = 0.35;

  function measureNaturalSize() {
    const wrapper = document.querySelector('.banner-wrapper');
    naturalHeight = document.querySelector('.session-banner').offsetHeight + 25;
  }

  function applyScale() {
    measureNaturalSize();
    const wrapper = document.querySelector('.banner-wrapper');
    const availW = window.innerWidth - 8;
    const availH = window.innerHeight - 8;
    let scale = Math.min(availW / naturalWidth, availH / naturalHeight, 1);
    scale = Math.max(scale, MIN_SCALE);
    wrapper.style.transform = `translateX(-50%) scale(${scale})`;
    wrapper.style.transformOrigin = 'top center';
  }

  window.addEventListener('resize', applyScale);
  window.addEventListener('DOMContentLoaded', () => {
    measureNaturalSize();
    applyScale();
  });

  if (window.electronAPI && window.electronAPI.onInteractiveModeChange) {
    window.electronAPI.onInteractiveModeChange((active) => {
      document.querySelector('.session-banner').classList.toggle('interactive-mode', active);
    });
  }

  function resetSession() {
    localStorage.removeItem('sag_session_start_acc');
    localStorage.removeItem('sag_session_start_tanks');
    previousWr = null;
    previousDmg = null;
    updateStats();
  }

  function getWinrateColor(wr) {
    if (wr < 50) return '#FF5555';
    if (wr < 60) return '#5db35e';
    if (wr < 70) return '#3972c6';
    return '#6f319e';
  }

  function formatWithTrend(currentValue, previousValue, suffix = '') {
    if (previousValue === null || currentValue === previousValue) {
      return `${currentValue}${suffix}`;
    }
    if (currentValue > previousValue) {
      return `${currentValue}${suffix} <span class="trend-arrow trend-up">▲</span>`;
    } else {
      return `${currentValue}${suffix} <span class="trend-arrow trend-down">▼</span>`;
    }
  }

  async function updateStats() {
    try {
      if (Object.keys(vehicleDetailsMap).length === 0) await fetchTankNames();

      const timestamp = Date.now();
      const accountUrl = `https://api.wotblitz.eu/wotb/account/info/?application_id=${CONFIG.APPLICATION_ID}&account_id=${CONFIG.ACCOUNT_ID}&fields=statistics.all&_nc=${timestamp}`;
      const tanksUrl = `https://api.wotblitz.eu/wotb/tanks/stats/?application_id=${CONFIG.APPLICATION_ID}&account_id=${CONFIG.ACCOUNT_ID}&fields=tank_id,all.battles,all.wins,all.damage_dealt,all.frags,all.spotted,all.dropped_capture_points&_nc=${timestamp}`;

      const [accRes, tanksRes] = await Promise.all([
        fetch(accountUrl, { cache: "no-store" }),
        fetch(tanksUrl, { cache: "no-store" })
      ]);

      const accData = await accRes.json();
      const tanksData = await tanksRes.json();

      if (accData.status !== "ok" || !accData.data[CONFIG.ACCOUNT_ID]) return;

      const currentAll = accData.data[CONFIG.ACCOUNT_ID].statistics.all;
      const currentTanks = tanksData.data[CONFIG.ACCOUNT_ID] || [];

      const savedAccStart = localStorage.getItem('sag_session_start_acc');
      const savedTanksStart = localStorage.getItem('sag_session_start_tanks');

      let startAcc, startTanksMap = {};

      if (savedAccStart && savedTanksStart) {
        startAcc = JSON.parse(savedAccStart);
        startTanksMap = JSON.parse(savedTanksStart);
      } else {
        startAcc = currentAll;
        currentTanks.forEach(t => { startTanksMap[t.tank_id] = t.all; });
        localStorage.setItem('sag_session_start_acc', JSON.stringify(currentAll));
        localStorage.setItem('sag_session_start_tanks', JSON.stringify(startTanksMap));
      }

      const battles = currentAll.battles - startAcc.battles;
      const wins = currentAll.wins - startAcc.wins;
      const damage = currentAll.damage_dealt - startAcc.damage_dealt;

      document.getElementById('battles').innerText = battles;

      const tanksListBody = document.getElementById('tanks-list-body');
      let activeTanksList = [];

      if (battles > 0) {
        const wr = parseFloat(((wins / battles) * 100).toFixed(1));
        const avgDmg = Math.round(damage / battles);

        const wrElem = document.getElementById('winrate');
        wrElem.innerHTML = formatWithTrend(wr, previousWr, '%');
        wrElem.style.color = getWinrateColor(wr);
        wrElem.style.textShadow = '-1px -1px 0 #FFF, 1px -1px 0 #FFF, -1px 1px 0 #FFF, 1px 1px 0 #FFF';

        const dmgElem = document.getElementById('avg-damage');
        dmgElem.innerHTML = formatWithTrend(avgDmg, previousDmg);

        previousWr = wr;
        previousDmg = avgDmg;

        currentTanks.forEach(tank => {
          const tId = Number(tank.tank_id);
          const curr = tank.all;
          const prev = startTanksMap[tId] || { battles: 0, wins: 0, damage_dealt: 0 };

          const deltaB = curr.battles - prev.battles;
          if (deltaB > 0) {
            const deltaW = curr.wins - prev.wins;
            const deltaD = curr.damage_dealt - prev.damage_dealt;

            let tankInfo = vehicleDetailsMap[tId] || { name: `ID: ${tId}`, tier: 10 };

            activeTanksList.push({
              name: tankInfo.name,
              battles: deltaB,
              wr: parseFloat(((deltaW / deltaB) * 100).toFixed(1)),
              avgDmg: Math.round(deltaD / deltaB)
            });
          }
        });

        activeTanksList.sort((a, b) => b.battles - a.battles);
        tanksListBody.innerHTML = activeTanksList.map(t => {
          const tWrColor = getWinrateColor(t.wr);
          return `
            <tr>
              <td class="tank-name">${t.name}</td>
              <td>${t.battles}</td>
              <td style="color: ${tWrColor}; text-shadow: -1px -1px 0 #FFF, 1px -1px 0 #FFF, -1px 1px 0 #FFF, 1px 1px 0 #FFF;">${t.wr}%</td>
              <td>${t.avgDmg}</td>
            </tr>
          `;
        }).join('');

      } else {
        document.getElementById('winrate').innerText = '0%';
        document.getElementById('winrate').style.color = '#FFF';
        document.getElementById('winrate').style.textShadow = 'none';
        document.getElementById('avg-damage').innerText = '0';
        previousWr = null;
        previousDmg = null;
        tanksListBody.innerHTML = '<tr><td colspan="4" class="no-tanks">Немає зіграних боїв</td></tr>';
      }
      applyScale();
    } catch (e) {
      console.error("Помилка під час оновлення статистики:", e);
    }
  }

  updateStats();
  setInterval(updateStats, 5000);
</script>

</html>

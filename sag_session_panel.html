  // Формуємо словник назв на основі LOCAL_TANK_NAMES
  let nameMap = {};
  for (const id in LOCAL_TANK_NAMES) {
    nameMap[id] = LOCAL_TANK_NAMES[id].name;
  }

  function wrColor(wr) {
    if (wr < 50) return '#FF5555';
    if (wr < 60) return '#5db35e';
    if (wr < 70) return '#3F9EE4';
    return '#c06dff';
  }

  async function loadNames() {
    try {
      let page = 1, total = 1;
      while (page <= total && page <= 8) {
        const r = await fetch(`https://${API_HOST}/wotb/encyclopedia/vehicles/?application_id=${APP_ID}&language=ru&page_no=${page}&fields=name,tank_id`);
        const d = await r.json();
        if (d.status !== 'ok') break;
        total = (d.meta && d.meta.page_total) || 1;
        for (const id in d.data) {
          if (!nameMap[id]) nameMap[id] = d.data[id].name;
        }
        page++;
      }
    } catch (e) {}
  }

  function reset() {
    localStorage.removeItem(LS_ACC);
    localStorage.removeItem(LS_TANKS);
    localStorage.removeItem(LS_ORDER);
    localStorage.removeItem('sag_session_trend_' + ACCOUNT_ID);
    localStorage.removeItem('sag_car_acc_' + ACCOUNT_ID);
    localStorage.removeItem('sag_car_trend_' + ACCOUNT_ID);
    localStorage.removeItem('sag_panel_acc_' + ACCOUNT_ID);
    localStorage.removeItem('sag_panel_tanks_' + ACCOUNT_ID);
    tick();
  }


  async function tick() {
    if (!ACCOUNT_ID) {
      document.getElementById('body').innerHTML = '<tr><td colspan="4" class="err">немає account_id</td></tr>';
      return;
    }
    try {
      const ts = Date.now();
      const [accRes, tanksRes] = await Promise.all([
        fetch(`https://${API_HOST}/wotb/account/info/?application_id=${APP_ID}&account_id=${ACCOUNT_ID}&fields=statistics.all&_nc=${ts}`, {cache:'no-store'}),
        fetch(`https://${API_HOST}/wotb/tanks/stats/?application_id=${APP_ID}&account_id=${ACCOUNT_ID}&fields=tank_id,all.battles,all.wins,all.damage_dealt&_nc=${ts}`, {cache:'no-store'})
      ]);
      const accData = await accRes.json();
      const tanksData = await tanksRes.json();
      if (accData.status === 'ok' && !accData.data[ACCOUNT_ID]) {
        // status "ok", але дані по акаунту відсутні — типова ознака
        // закритого профілю (наприклад, прес-акаунт WG), а не помилки API.
        document.getElementById('body').innerHTML = '<tr><td colspan="4" class="err">Прес-акаунт</td></tr>';
        return;
      }
      if (accData.status !== 'ok') return;

      const currentAll = accData.data[ACCOUNT_ID].statistics.all;
      const currentTanks = (tanksData && tanksData.status === 'ok' && tanksData.data && tanksData.data[ACCOUNT_ID]) ? tanksData.data[ACCOUNT_ID] : [];

      let startAcc = null, startTanks = {};
      try {
        startAcc = JSON.parse(localStorage.getItem(LS_ACC) || 'null');
        startTanks = JSON.parse(localStorage.getItem(LS_TANKS) || '{}');
      } catch (e) {}

      if (!startAcc) {
        startAcc = currentAll;
        localStorage.setItem(LS_ACC, JSON.stringify(startAcc));
      }
      if (!startTanks || Object.keys(startTanks).length === 0) {
        currentTanks.forEach(t => { startTanks[t.tank_id] = t.all; });
        localStorage.setItem(LS_TANKS, JSON.stringify(startTanks));
      }

      let order = [];
      try { order = JSON.parse(localStorage.getItem(LS_ORDER) || '[]'); } catch (e) { order = []; }
      if (!Array.isArray(order)) order = [];

      const list = [];
      currentTanks.forEach(t => {
        const id = t.tank_id;
        const prev = startTanks[id] || startTanks[String(id)] || { battles: 0, wins: 0, damage_dealt: 0 };
        const db = (t.all.battles || 0) - (prev.battles || 0);
        if (db > 0) {
          const dw = (t.all.wins || 0) - (prev.wins || 0);
          const dd = (t.all.damage_dealt || 0) - (prev.damage_dealt || 0);
          // перша поява танка в сесії — додаємо в кінець порядку
          const sid = String(id);
          if (order.indexOf(sid) === -1 && order.indexOf(id) === -1) {
            order.push(sid);
          }
          list.push({
            id: sid,
            name: nameMap[id] || nameMap[String(id)] || ('ID ' + id),
            battles: db,
            wr: +(dw / db * 100).toFixed(1),
            avg: Math.round(dd / db)
          });
        }
      });
      try { localStorage.setItem(LS_ORDER, JSON.stringify(order)); } catch (e) {}

      // порядок гри: хто раніше з'явився в сесії — вище
      const orderIndex = {};
      order.forEach((id, i) => { orderIndex[String(id)] = i; });
      list.sort((a, b) => {
        const ia = (a.id in orderIndex) ? orderIndex[a.id] : 9999;
        const ib = (b.id in orderIndex) ? orderIndex[b.id] : 9999;
        return ia - ib;
      });

      const body = document.getElementById('body');
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="4" class="empty">Немає зіграних боїв у сесії</td></tr>';
      } else {
        body.innerHTML = list.map(t => `
          <tr>
            <td class="name">${t.name}</td>
            <td>${t.battles}</td>
            <td style="color:${wrColor(t.wr)}">${t.wr}%</td>
            <td>${t.avg}</td>
          </tr>`).join('');
      }
    } catch (e) {
      console.error(e);
      document.getElementById('body').innerHTML = '<tr><td colspan="4" class="err">помилка API</td></tr>';
    }
  }

  window.addEventListener('storage', function (ev) {
    if (!ev.key) return;
    if (ev.key.indexOf('sag_session_') === 0 || ev.key.indexOf('sag_car_') === 0 || ev.key.indexOf('sag_panel_') === 0) {
      tick();
    }
  });
  tick();
  loadNames().then(tick);
  setInterval(tick, 5000);
})();
